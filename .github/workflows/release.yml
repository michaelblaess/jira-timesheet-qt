name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      # Ein Plattform-Fehlschlag soll die anderen nicht abwuergen - so sieht man
      # pro Release, was baut und was (noch) nicht.
      fail-fast: false
      matrix:
        # macos-latest ist Apple Silicon (arm64). macos-15-intel liefert den
        # x86_64-Build fuer aeltere Intel-Macs - ohne ihn lehnt macOS die App
        # mit "nicht mit dieser Version von macOS verwendbar" ab. Das Label ist
        # laut GitHub bis August 2027 verfuegbar, danach endet x86_64.
        os: [windows-latest, ubuntu-22.04, macos-latest, macos-15-intel]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # Nuitka braucht patchelf fuer --standalone; die Qt-xcb-Systemlibs, damit
      # das Plattform-Plugin gebuendelt/gefunden wird (sonst "Could not load the
      # Qt platform plugin xcb").
      - name: Install build + Qt deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf libxcb-cursor0 libxcb-xinerama0 \
            libxkbcommon-x11-0 libegl1 libgl1 libfontconfig1 libdbus-1-3

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./bootstrap.ps1
          ./compile-win64.ps1

      - name: Build (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ./bootstrap.sh
          ./compile-linux.sh

      - name: Build (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ./bootstrap.sh
          ./compile-macos.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          retention-days: 30
          name: dist-${{ matrix.os }}
          path: |
            dist/jira-timesheet-qt-v*.zip
            dist/jira-timesheet-qt-v*.tar.gz

  # Die fertigen Pakete zusaetzlich auf den eigenen Webspace legen. Sie liegen
  # dort je Version in einem eigenen Ordner - bewusst NEBEN dem Astro-Seitenbaum
  # (nicht unter downloads/), damit der Deploy der Projektseite und dieser hier
  # sich nicht ins Gehege kommen.
  publish:
    needs: build
    # Laedt hoch, was fertig geworden ist - auch wenn eine Plattform scheiterte.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest

    steps:
      - name: Zugangsdaten vorhanden?
        id: check
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
        run: |
          if [ -z "$FTP_HOST" ]; then
            echo "vorhanden=false" >> "$GITHUB_OUTPUT"
            echo "::warning::FTP-Zugangsdaten fehlen - Upload uebersprungen. Secrets FTP_HOST, FTP_USER und FTP_PASSWORD im Repo setzen."
          else
            echo "vorhanden=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Pakete einsammeln
        if: steps.check.outputs.vorhanden == 'true'
        uses: actions/download-artifact@v6
        with:
          merge-multiple: true
          path: pakete

      - name: Was liegt vor?
        if: steps.check.outputs.vorhanden == 'true'
        run: ls -lh pakete/

      - name: Auf michaelblaess.de hochladen
        if: steps.check.outputs.vorhanden == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Explizites FTPS - ohne diese Zeile faellt die Action auf
          # unverschluesseltes FTP zurueck und schickt die Zugangsdaten
          # im Klartext ueber die Leitung.
          protocol: ftps
          local-dir: ./pakete/
          # Je Version ein eigener Ordner: der Abgleich der Action kann damit
          # nur innerhalb dieses frischen Ordners wirken.
          server-dir: /michaelblaess.de/pakete/jira-timesheet-qt/${{ github.ref_name }}/
  release:
    needs: build
    # Auch wenn eine Plattform scheitert, die uebrigen Ergebnisse festhalten.
    if: always()
    runs-on: ubuntu-latest

    steps:
      # Seit dem Wechsel auf die BUSL sind die fertigen Programmpakete
      # kostenpflichtig. Sie haengen deshalb NICHT mehr am GitHub-Release,
      # sondern bleiben Actions-Artefakte - von dort gehen sie in den Verkauf.
      # Das Release selbst bleibt als Versionsmarke mit Aenderungsnotizen.
      - name: Create Release (ohne Programmpakete)
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body: |
            Die fertigen Programmpakete fuer Windows, macOS und Linux sind
            kostenpflichtig - siehe Abschnitt "Lizenz" in der README.

            Wer selbst baut, kann diese Version wie gewohnt aus dem Quelltext
            erzeugen: `uv sync` und starten. Das ist ausdruecklich erlaubt und
            kostenlos.
