name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      # Ein Plattform-Fehlschlag soll die anderen nicht abwuergen - so sieht man
      # pro Release, was baut und was (noch) nicht.
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # Nuitka braucht patchelf fuer --standalone; die Qt-xcb-Systemlibs, damit
      # das Plattform-Plugin gebuendelt/gefunden wird (sonst "Could not load the
      # Qt platform plugin xcb").
      - name: Install build + Qt deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf libxcb-cursor0 libxcb-xinerama0 \
            libxkbcommon-x11-0 libegl1 libgl1 libfontconfig1 libdbus-1-3

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./bootstrap.ps1
          ./compile-win64.ps1

      - name: Build (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ./bootstrap.sh
          ./compile-linux.sh

      - name: Build (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ./bootstrap.sh
          ./compile-macos.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          retention-days: 1
          name: dist-${{ matrix.os }}
          path: |
            dist/jira-timesheet-qt-v*.zip
            dist/jira-timesheet-qt-v*.tar.gz

  release:
    needs: build
    # Auch wenn eine Plattform scheitert, die erfolgreichen Artefakte
    # veroeffentlichen.
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            *.zip
            *.tar.gz
